workflows:
  android-workflow:
    name: Android AAB Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Fix missing android folder
        script: |
          flutter create . --platforms=android --org com.fiveyogi.app --project-name five_yogi
      - name: Get dependencies
        script: |
          flutter pub get
      - name: Build AAB for Play Store
        script: |
          flutter build appbundle --release
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/*.apk
