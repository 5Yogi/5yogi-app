
workflows:
  android-production:
    name: 5Yogi Production Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Fix android folder
        script: |
          rm -rf android
          flutter create . --platforms=android --org com.fiveyogi.app --project-name five_yogi --overwrite
      - name: Get dependencies
        script: |
          flutter pub get
      - name: Build AAB Production
        script: |
          flutter build appbundle --release
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/*.apk
